<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Who Chop My Data?</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chop Data">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--y:#ffc61a;--ink:#0a0c26;--f:"Arial Black","Segoe UI Black","sans-serif-black",system-ui,-apple-system,sans-serif;
--ol:2px 0 0 #0a0c26,-2px 0 0 #0a0c26,0 2px 0 #0a0c26,0 -2px 0 #0a0c26,2px 2px 0 #0a0c26,-2px -2px 0 #0a0c26,2px -2px 0 #0a0c26,-2px 2px 0 #0a0c26,0 4px 0 #0a0c26;
--dim:rgba(4,6,24,.6);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dim:rgba(4,6,24,.6)}}
:root[data-theme="dark"]{--dim:rgba(4,6,24,.6)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#070b1f}
*{box-sizing:border-box}
body{margin:0;height:100%;background:#070b1f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
#stage{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#070b1f}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
#ov.on{display:flex;animation:fade .25s ease-out}
#ov.dim{background:var(--dim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@keyframes drop{from{transform:translateY(-34px);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes wig{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes sp{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes print{from{clip-path:inset(0 -20px 100% -20px)}to{clip-path:inset(0 -20px -20px -20px)}}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.8);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.85}}
/* hub */
.hub{flex:1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(rgba(5,7,30,.6),rgba(5,7,30,0) 24%,rgba(5,7,30,0) 58%,rgba(5,7,30,.55))}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 12px 0;gap:10px}
.coinp{display:flex;align-items:center;gap:8px;background:#0b0e30;border:4px solid var(--ink);border-radius:30px;padding:3px 4px 3px 6px;box-shadow:0 4px 0 var(--ink),inset 0 0 0 2px #3a43a6;font:900 20px var(--f);animation:drop .5s .1s both}
.coinp img{width:30px;height:30px}
.plus{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(#8bf9ad,#22b455);color:#052e16;font:900 20px/1 var(--f);padding:0}
.rk{text-align:right;transform:skewX(-6deg);background:var(--y);color:var(--ink);border:4px solid var(--ink);border-radius:10px;padding:3px 14px 4px;box-shadow:0 4px 0 var(--ink);animation:drop .5s .2s both}
.rk small{display:block;font:900 10px var(--f);letter-spacing:.1em;opacity:.65;text-transform:uppercase}.rk b{font:900 15px var(--f);text-transform:uppercase}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;min-height:0}
.mas{animation:bob 2.2s ease-in-out infinite;line-height:0}.mas img{width:clamp(76px,20vh,128px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.mas.sm img{width:84px}
.logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-3deg);margin:4px 0 16px;animation:popin .6s .1s both cubic-bezier(.2,1.6,.4,1)}
.logo b{white-space:nowrap;font:900 italic clamp(38px,13.5vw,68px)/.92 var(--f);color:var(--y);text-shadow:var(--ol),0 8px 0 var(--ink);letter-spacing:-.02em}
.logo i{font:900 italic clamp(24px,8vw,38px)/1 var(--f);color:#fff;background:#e11d2e;border:4px solid var(--ink);border-radius:8px;padding:2px 20px 4px;transform:skewX(-8deg);box-shadow:0 5px 0 var(--ink);text-shadow:var(--ol);margin-top:6px}
.play{width:min(84%,330px);padding:10px 0 12px;font-size:44px;line-height:1;letter-spacing:.05em;animation:popin .6s .3s both cubic-bezier(.2,1.6,.4,1)}
.play small{display:block;font:900 14px var(--f);letter-spacing:.14em;opacity:.75;margin-top:5px}
.play::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
.tag{margin-top:12px;background:rgba(5,7,30,.7);border:3px solid var(--ink);border-radius:20px;padding:6px 14px;font:900 12px var(--f);letter-spacing:.06em;text-transform:uppercase;color:#cfd3ff}
.nav{display:flex;padding:0 6px 6px;background:linear-gradient(#1d2368,#0b0e34);border-top:4px solid var(--ink);position:relative}
.nav::before{content:'';position:absolute;left:0;right:0;top:-14px;height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,var(--ink) 14px 28px);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.nv{flex:1;position:relative;background:none;border:0;padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:900 11px var(--f);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:var(--ol)}
.nv img{width:40px;height:40px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45));transition:transform .1s}
.nv:active img{transform:scale(.88)}
.dot{position:absolute;top:6px;right:calc(50% - 30px);width:16px;height:16px;border-radius:50%;background:#ff3b30;border:3px solid var(--ink);animation:wig 1.2s infinite}
/* panels */
.panel{position:relative;margin:auto;width:min(92%,400px);max-height:84%;display:flex;flex-direction:column;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px),linear-gradient(#232b7e,#141a56);border:4px solid var(--ink);border-radius:22px;box-shadow:inset 0 0 0 3px #4552c4,0 8px 0 #05071b,0 24px 40px rgba(0,0,0,.5);animation:popin .4s cubic-bezier(.2,1.5,.4,1) both}
.still .panel{animation:none}
.hd{position:absolute;left:50%;top:-25px;transform:translateX(-50%) skewX(-6deg);white-space:nowrap;background:var(--y);color:var(--ink);padding:6px 26px 8px;border:4px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink);font:900 19px var(--f);text-transform:uppercase;letter-spacing:.04em;z-index:2}
.hd.red{background:#ff4a3d;color:#fff;text-shadow:var(--ol)}.hd.grn{background:#2fcf6f}
.x{position:absolute;top:-18px;right:-8px;width:44px;height:44px;border-radius:12px;border:4px solid var(--ink);background:linear-gradient(#ff8576,#e62e1e);box-shadow:0 4px 0 var(--ink);padding:0;z-index:3;display:flex;align-items:center;justify-content:center}
.x img{width:24px;height:24px}
.bd{overflow:auto;padding:34px 14px 14px;-webkit-overflow-scrolling:touch}
.ft{display:flex;gap:10px;padding:12px 14px 14px;border-top:4px solid var(--ink);background:rgba(0,0,0,.28);border-radius:0 0 18px 18px}
.mu{color:#cfd3ff;font-size:13px;line-height:1.4;margin:6px 0}.c{text-align:center}
.rib{margin:14px -14px 10px;text-align:center;background:linear-gradient(90deg,transparent,var(--ink) 12%,var(--ink) 88%,transparent);color:var(--y);font:900 14px var(--f);letter-spacing:.1em;padding:4px 0;text-transform:uppercase}
/* buttons */
.b{--sh:#9a5a00;position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:16px;padding:12px 18px;font:900 18px var(--f);text-transform:uppercase;letter-spacing:.03em;color:#3b2200;background:linear-gradient(#ffe066,#ffb703);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(0,0,0,.16),0 6px 0 var(--sh),0 10px 12px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.5);transition:transform .06s}
.b:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(0,0,0,.16),0 1px 0 var(--sh)}
.b.g{--sh:#0b6a2b;background:linear-gradient(#8bf9ad,#22b455);color:#052e16}
.b.r{--sh:#8c1208;background:linear-gradient(#ff8576,#e62e1e);color:#fff;text-shadow:var(--ol)}
.b.n{--sh:#12165a;background:linear-gradient(#6a76ee,#3a44b8);color:#fff;text-shadow:var(--ol)}
.b[disabled]{filter:grayscale(.9) brightness(.7)}
.b.big{font-size:24px;padding:14px 20px;width:100%}
.b.ib{width:58px;flex:none;padding:0;display:flex;align-items:center;justify-content:center}.ib img{width:30px;height:30px}
.b:focus-visible,.nv:focus-visible,.ps:focus-visible,.pk:focus-visible,.sw:focus-visible,.in:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* shop */
.bal{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 auto 14px;width:max-content;background:#0b0e30;border:4px solid var(--ink);border-radius:30px;padding:4px 20px 4px 10px;font:900 22px var(--f)}.bal img{width:28px;height:28px}
.up{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.3);border:3px solid var(--ink);border-radius:14px;padding:8px;margin:0 0 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.fr{width:54px;height:54px;flex:none;border-radius:12px;background:radial-gradient(#3b44a8,#1a1f66);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}.fr img{width:38px;height:38px}
.up .tx{flex:1;min-width:0;font-size:12px;line-height:1.3;color:#cfd3ff}.up .tx b{display:block;font:900 14px var(--f);color:#fff;text-transform:uppercase;text-shadow:0 2px 0 var(--ink)}
.up .b{padding:8px 10px;font-size:15px;min-width:80px;display:flex;align-items:center;gap:4px;justify-content:center}.up .b img{width:20px;height:20px}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:12px;height:9px;border-radius:2px;background:#0b0e30;border:2px solid var(--ink)}.pips i.on{background:var(--y)}
/* dossier */
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .b{flex:1;padding:8px;font-size:13px}
.dp{background:rgba(0,0,0,.35);border:3px solid var(--ink);border-radius:12px;padding:10px;font-size:13px;line-height:1.4;min-height:96px;margin-bottom:14px}.dp b{font:900 14px var(--f);text-transform:uppercase}.dp .fx{color:#7af7a0;margin:6px 0 2px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.ps{position:relative;background:#f3e5bd;color:#2a1704;border:3px solid var(--ink);border-radius:5px;padding:12px 4px 7px;text-align:center;transform:rotate(var(--r,0deg));box-shadow:0 4px 0 rgba(0,0,0,.45);font:900 10px/1.1 var(--f);text-transform:uppercase}
.ps::before{content:'';position:absolute;top:-8px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:#e11d2e;border:2px solid var(--ink)}
.ps .pc{width:54px;height:54px;margin:0 auto 5px;border-radius:50%;background:#2a0f0a;border:3px solid #ff6a3d;display:flex;align-items:center;justify-content:center}.ps .pc img{width:38px;height:38px}
.ps.lk{background:#3a3f6e;color:#aab}.ps.lk .pc{background:#14173f;border-color:#555a99}.ps.lk img{filter:brightness(0) opacity(.5)}
.ps.sel{outline:4px solid var(--y)}
.bgg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgc{background:rgba(0,0,0,.3);border:3px solid var(--ink);border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;line-height:1.3;color:#cfd3ff}.bgc b{display:block;font:900 12px var(--f);color:#fff;text-transform:uppercase;margin-top:4px}.bgc.lk img{filter:grayscale(1) brightness(.5)}.bgc img{width:44px;height:44px}
/* mission, results */
.mis{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.mbadge{width:72px;height:72px;flex:none;border-radius:50%;background:radial-gradient(#ffe066,#ff9a00);border:5px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font:900 32px var(--f);color:var(--ink)}
.mis h3{margin:0;font:900 20px/1.05 var(--f);text-transform:uppercase;text-shadow:var(--ol)}.mis p{margin:4px 0 0;font-size:13px;line-height:1.35;color:#cfd3ff}
.hero{display:flex;gap:10px;background:rgba(0,0,0,.32);border:3px solid var(--ink);border-radius:14px;padding:10px;margin-top:10px}
.hero .fr{width:62px;height:62px}.hero .fr img{width:46px;height:46px}
.hero em{display:inline-block;font:900 10px var(--f);font-style:normal;letter-spacing:.1em;background:#ff4a3d;border:2px solid var(--ink);border-radius:6px;padding:1px 6px;margin-bottom:3px;text-transform:uppercase}
.hero.ok em{background:#22b455}.hero.pw em{background:var(--y);color:var(--ink)}
.hero b{display:block;font:900 14px var(--f);text-transform:uppercase;text-shadow:0 2px 0 var(--ink)}.hero p{margin:3px 0 0;font-size:12px;line-height:1.35;color:#d9dcff}.hero .fx{color:#7af7a0}
.sr{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:0 0 12px}
.sr svg{width:56px;height:56px;filter:drop-shadow(0 4px 0 var(--ink));opacity:0;animation:sp .5s cubic-bezier(.2,1.8,.4,1) forwards}
.sr svg:nth-child(1){animation-delay:.15s}.sr svg:nth-child(2){width:72px;height:72px;animation-delay:.35s}.sr svg:nth-child(3){animation-delay:.55s}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{background:rgba(0,0,0,.32);border:3px solid var(--ink);border-radius:12px;padding:8px;text-align:center}.rt.wide{grid-column:1/-1}
.rt small{display:block;font:900 10px var(--f);letter-spacing:.08em;text-transform:uppercase;color:#aab4ff}
.rt b{font:900 22px var(--f);text-shadow:var(--ol);display:flex;align-items:center;justify-content:center;gap:4px}.rt img{width:22px;height:22px}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{background:linear-gradient(#fff0b8,#ffd25e);color:#2b1700;border:4px solid var(--ink);border-radius:14px;padding:8px 4px 10px;text-align:center;box-shadow:0 5px 0 #8c5400;display:flex;flex-direction:column;align-items:center;gap:4px;animation:popin .45s both cubic-bezier(.2,1.5,.4,1)}
.pk:nth-child(2){animation-delay:.1s}.pk:nth-child(3){animation-delay:.2s}
.pk .fr{background:#2a1c5c;width:50px;height:50px}.pk .fr img{width:34px;height:34px}
.pk b{font:900 12px/1.1 var(--f);text-transform:uppercase}.pk span{font:700 11px/1.25 system-ui}
.pk:active{transform:translateY(4px);box-shadow:0 1px 0 #8c5400}
.wait .pk{pointer-events:none;opacity:.7}
.mrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.say{position:relative;background:#fff7dc;color:#2a1704;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font:900 14px/1.15 var(--f);text-transform:uppercase;flex:1}
.say::before{content:'';position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.nbst{background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:3px 12px;font:900 13px var(--f);text-align:center;transform:rotate(-2deg);margin:0 auto 12px;width:max-content;box-shadow:0 3px 0 var(--ink);text-transform:uppercase}
.nu{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-size:12px;margin-top:12px}.nu>div{flex:1}.nu img{width:34px;height:34px}
.nu b{font:900 12px var(--f);text-transform:uppercase}.pb{height:14px;border-radius:7px;background:#0b0e30;border:3px solid var(--ink);margin-top:4px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(#ffe066,#ffb703)}
/* receipt */
.rcw{filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));animation:print .9s steps(16) both;margin:0 2px}
.rc{position:relative;background:#fffdf3;color:#1a1a1a;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;padding:26px 16px 30px}
.rc .c{text-align:center}.rc .bold{font-weight:800}.rc hr{border:0;border-top:2px dashed #999;margin:9px 0}
.rc .ln{display:flex;gap:6px;margin:4px 0;align-items:flex-end}.rc .ln i{flex:1;border-bottom:2px dotted #aaa;transform:translateY(-4px)}.rc .ln.big{font-size:14px;font-weight:800}
.rc .v{margin:8px 0;line-height:1.4}
.rc .barc{height:34px;margin:10px 18px 6px;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px)}
.stp{position:absolute;right:8px;top:92px;transform:rotate(-14deg);border:4px solid #d11;color:#d11;padding:3px 10px;font:900 20px var(--f);text-transform:uppercase;opacity:.85;mix-blend-mode:multiply;animation:stamp .5s 1.1s both}
/* settings, inputs */
.tr{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;margin-bottom:10px;font:900 15px var(--f);text-transform:uppercase}.tr img{width:34px;height:34px}.tr span{flex:1}
.sw{width:64px;height:32px;border-radius:16px;background:#3a3f6e;border:4px solid var(--ink);position:relative;padding:0;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.sw.on{background:#22b455}.sw.on::after{left:32px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cg .b{padding:10px 8px;font-size:14px}
.in{width:100%;border:3px solid var(--ink);border-radius:10px;padding:11px;font:700 15px system-ui;background:#0b0e30;color:#fff;user-select:text;-webkit-user-select:text;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.ir{display:flex;gap:8px;margin-bottom:8px}.ir .in:first-child{flex:2}.ir .in:last-child{flex:1}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%) translateY(10px);background:#fff7dc;color:#2a1704;border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:8px 14px;font:900 13px var(--f);text-transform:uppercase;opacity:0;pointer-events:none;transition:.2s;text-align:center;max-width:92%;z-index:5}
.toast.on{opacity:1;transform:translateX(-50%)}
.sy{align-self:flex-start;margin:8px 12px 0;display:flex;align-items:center;gap:6px;font:900 10px var(--f);letter-spacing:.06em;text-transform:uppercase;background:rgba(5,7,30,.72);border:3px solid var(--ink);border-radius:20px;padding:4px 10px}.sy i{width:9px;height:9px;border-radius:50%;flex:none}
.tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}.tags .tag{margin-top:0}
.gearb{width:46px;height:46px;flex:none;border-radius:14px;border:4px solid var(--ink);background:linear-gradient(#6a76ee,#3a44b8);box-shadow:0 4px 0 var(--ink);padding:0;display:flex;align-items:center;justify-content:center;animation:drop .5s .3s both}.gearb img{width:28px;height:28px}
.top .rk{margin-left:auto}
.lbs{margin-top:4px}.lb{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin-bottom:6px}
.lb.me{background:rgba(255,198,26,.18);border-color:var(--y)}
.lb .rn{width:30px;height:30px;border-radius:50%;background:#0b0e30;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:900 13px var(--f);flex:none}
.lb:nth-child(1) .rn{background:#ffc61a;color:#0a0c26}.lb:nth-child(2) .rn{background:#cfd6e4;color:#0a0c26}.lb:nth-child(3) .rn{background:#e09a5b;color:#0a0c26}
.lb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:900 14px var(--f);text-transform:uppercase}
.lb small{color:#aab4ff;font:900 10px var(--f);margin-left:4px}.lb b{font:900 16px var(--f)}
.cb{height:10px;border-radius:5px;background:linear-gradient(#ffe066,#ffb703);border:2px solid var(--ink);margin-top:4px}

  get:function(k){if(Store.ls)return Promise.resolve(lsGet('kv.'+k));return DB.tx('kv','readonly',function(s){return s.get(k)})},
  set:function(k,v){if(Store.ls){lsSet('kv.'+k,v);return Promise.resolve()}return DB.tx('kv','readwrite',function(s){s.put(v,k)})},
  all:function(){if(Store.ls)return Promise.resolve(lsGet('ob')||[]);return DB.tx('ob','readonly',function(s){return s.getAll()})},

};
Store.persist=function(fn){Store.wq=Store.wq.then(fn).catch(function(){Store.errs++});return Store.wq};
Store.saveMeta=function(){var m=clone(Store.meta);return Store.persist(function(){return DB.set('meta',m)})};

Store.rebuild=function(){var p=clone(Store.srv),a=Store.acc,k;Store.ob.forEach(function(o){ap(p,o)});p.n=Math.max(0,p.n+a.a);for(k in a.k)p.kills[k]=(p.kills[k]||0)+a.k[k];p.tk+=a.tk;p.del+=a.d;P=p};
Store.mk=function(t,d){return{q:++Store.meta.qn,id:uid(),t:t,ts:Date.now(),d:d}};
Store.enq=function(t,d,merge){
  var last=Store.ob[Store.ob.length-1],k;
  if(merge&&last&&last.t===t&&!last.sent){
    if(t==='earn'&&Math.abs(last.d.a+d.a)<50000){last.d.a+=d.a;var l1=clone(last);Store.persist(function(){return DB.add(l1)});return last}
    if(t==='stat'&&last.d.tk+d.tk<2000&&last.d.del+d.del<2000&&Object.keys(d.k).every(function(x){return(last.d.k[x]||0)+d.k[x]<1000})){for(k in d.k)last.d.k[k]=(last.d.k[k]||0)+d.k[k];last.d.tk+=d.tk;last.d.del+=d.del;var l2=clone(last);Store.persist(function(){return DB.add(l2)});return last}

Store.flushAcc=function(){

  Store.persist(function(){return DB.set('acc',{a:0,k:{},tk:0,d:0})});

  e.innerHTML='<i style="background:'+c+'"></i>'+t};
Store.bg=function(){try{if(Store.reg&&Store.reg.sync)Store.reg.sync.register('wcmd-sync').catch(function(){})}catch(e){}};

Store.retry=function(sec){Store.fail++;var d=sec?sec*1000:Math.min(300000,2000*Math.pow(2,Store.fail))*(.7+Math.random()*.6);clearTimeout(Store.timer);Store.timer=setTimeout(Store.sync,d)};
Store.sync=async function(){
  if(Store.busy||!Store.ready)return;
  Store.flushAcc();
  var ops=Store.ob.slice(0,60);
  if(!ops.length&&Store.meta.token&&Date.now()-Store.meta.lastSync<120000)return;
  if(Store.noApi&&Date.now()-Store.meta.lastSync<600000&&Store.meta.lastTry&&Date.now()-Store.meta.lastTry<600000)return;
  Store.busy=1;Store.meta.lastTry=Date.now();Store.setState('sync');
  var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort()},15000);
  try{
    ops.forEach(function(o){o.sent=1});
    var body=JSON.stringify({dev:Store.meta.dev,ops:ops.map(function(o){return{id:o.id,t:o.t,ts:o.ts,d:o.d}})});
    var h={'Content-Type':'application/json'};if(Store.meta.token)h.Authorization='Bearer '+Store.meta.token;
    var r=await fetch(API+'/sync',{method:'POST',headers:h,body:body,signal:ctl?ctl.signal:undefined,keepalive:body.length<60000});
    if(r.status===401){await Store.reregister();Store.busy=0;Store.setState('off');Store.kick(500);return}
    if(r.status===404||r.status===405||(r.ok&&(r.headers.get('content-type')||'').indexOf('json')<0)){Store.noApi=1;Store.setState('idle');Store.saveMeta();return}
    if(r.status===429||r.status===503){Store.busy=0;Store.setState('off');Store.retry(+r.headers.get('retry-after')||30);return}
    if(!r.ok)throw new Error('http '+r.status);
    var txt=await r.text(),j=JSON.parse(txt),m=Store.meta;
    Store.noApi=0;
    if(j.token){m.token=j.token;m.rec=j.recovery}
    m.player=j.player;m.skew=j.now-Date.now();m.lastSync=Date.now();m.bout+=body.length;m.bin+=txt.length;
    var qs=[],rej=[];
    Store.ob=Store.ob.filter(function(o){var st=j.results[o.id];if(st===undefined)return true;qs.push(o.q);if(st.indexOf('rej')===0)rej.push([o,st]);return false});
    if(j.seq>=Store.srvSeq){Store.srv=j.profile;Store.srvSeq=j.seq;Store.saveSrv()}
    Store.rank=j.rank;Store.rebuild();
    Store.persist(function(){return DB.del(qs)});Store.saveMeta();
    rej.forEach(function(x){if(x[0].t==='buy')toast('A purchase was undone after syncing');else if(x[0].t==='set'&&x[1]==='rej:name')toast('That name is not allowed')});
    Store.fail=0;Store.setState('ok');Store.busy=0;
    if(Store.ob.length)Store.kick(300);
    if(cur===menu||cur===settings||cur===boards)Store.paint();
  }catch(e){Store.busy=0;Store.setState('off');Store.retry()}
  finally{clearTimeout(to);Store.busy=0}
};
Store.reregister=async function(){
  /* The server no longer knows this device (data loss or wipe). Seed a new player from the local copy. */
  var snap=clone(P),m=Store.meta;m.token='';m.player='';m.rec='';Store.acc={a:0,k:{},tk:0,d:0};
  var qs=Store.ob.map(function(o){return o.q});Store.ob=[];Store.srv=EMPTY();Store.srvSeq=-1;
  Store.persist(function(){return DB.del(qs)});Store.persist(function(){return DB.set('acc',Store.acc)});
  Store.enq('import',snap,0);Store.saveSrv();Store.saveMeta();Store.rebuild();
};
Store.reload=async function(){
  if(Store.busy)return;
  var m=await DB.get('meta'),qn=Store.meta.qn;if(m){Store.meta=Object.assign({},Store.meta,m);Store.meta.qn=Math.max(qn,m.qn||0)}
  var sq=await DB.get('srvseq');if(sq!=null&&sq>=Store.srvSeq){Store.srv=(await DB.get('srv'))||Store.srv;Store.srvSeq=sq}
  var db=await DB.all(),have={};db.forEach(function(o){o.sent=1;have[o.q]=1});
  Store.ob.forEach(function(o){if(!have[o.q]&&!o.sent)db.push(o)});
  Store.ob=db.sort(function(a,b){return a.q-b.q});Store.rebuild();Store.paint();
};

Store.restore=async function(code){
  try{
    var r=await fetch(API+'/recover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,dev:Store.meta.dev})});
    if(r.status===404)return'bad';if(r.status===429)return'wait';if(!r.ok)return'err';
    var j=await r.json(),m=Store.meta,qs=Store.ob.map(function(o){return o.q});

    Store.ob=[];Store.acc={a:0,k:{},tk:0,d:0};Store.srv=j.profile;Store.srvSeq=j.seq;
    Store.persist(function(){return DB.del(qs)});Store.persist(function(){return DB.set('acc',Store.acc)});Store.persist(function(){return DB.set('run',null)});Store.run=null;
    Store.saveSrv();Store.saveMeta();Store.rebuild();return'ok';

Store.wipe=async function(){
  try{if(Store.meta.token)await fetch(API+'/me',{method:'DELETE',headers:{Authorization:'Bearer '+Store.meta.token}})}catch(e){}

  var m=await DB.get('meta');

  Store.srv=(await DB.get('srv'))||EMPTY();var sq=await DB.get('srvseq');Store.srvSeq=sq==null?-1:sq;
  Store.ob=((await DB.all())||[]).sort(function(a,b){return a.q-b.q});Store.ob.forEach(function(o){o.sent=1});
  Store.acc=(await DB.get('acc'))||{a:0,k:{},tk:0,d:0};Store.run=await DB.get('run');Store.bd=await DB.get('boards');

    Store.meta.mig=1;
    try{var lg=JSON.parse(localStorage.getItem('wcmd3')||'null');
      if(lg&&!Store.ob.length&&!Store.meta.token){var d={};['n','up','best','kills','tk','del','badge','runs','city','sf','mu'].forEach(function(k){if(lg[k]!==undefined)d[k]=lg[k]});Store.enq('import',d,0)}}catch(e){}

  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  Store.kick(800);
};

}
function frame(now){

  try{
    cx.save();if(S&&S.shake>0){S.shake-=dt;var m=S.shake*26;cx.translate((Math.random()-.5)*m,(Math.random()-.5)*m)}
    var inPlay=(mode==='play'||mode==='pause'||mode==='sum')&&S,p=inPlay?clamp(S.prog,0,1):(t/50)%1;

    drawParts(dt);cx.restore();
  }catch(e){

  }

}
